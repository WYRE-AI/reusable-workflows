name: MCP Server Verify (reusable)

# Verify-only (build, lint, test) counterpart of mcp-server-release.yml, for
# callers' pull_request runs (WYREAI-714).
#
# WHY A SEPARATE FILE: a caller job's `permissions` is a ceiling for every job
# in the workflow it calls, and a nested job that asks for more fails workflow
# validation even when its `if:` would skip it. mcp-server-release.yml contains
# jobs that need contents/packages/security-events: write and id-token: write,
# so a caller job can only call it by granting all of those, on pull_request
# too. This file contains no such job, so a pull_request-only caller job can
# call it with `contents: read` + `packages: read` and no `secrets:`.
#
# The job below is the same as `verify` in mcp-server-release.yml. Keep the
# two in sync (steps, SHA pins, --ignore-scripts, persist-credentials).
#
# Least privilege, in this file:
#   - permissions: contents: read + packages: read (npm.pkg.github.com needs
#     packages: read to serve the @wyre-* SDKs). Nothing else, no id-token.
#   - no secret referenced except the automatic GITHUB_TOKEN.
#   - checkout with persist-credentials: false.
#   - npm ci --ignore-scripts, so no dependency lifecycle script runs with the
#     npm auth token in its environment. The build runs explicitly, so the
#     repos' `prepare: npm run build` is not needed; see the note on `verify`
#     in mcp-server-release.yml for what was checked.

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version for install, build, lint, and test.'
        required: false
        type: string
        default: '22'

jobs:
  verify:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # npm ci of @wyre-technology/* SDKs from GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wyre-ai'

      # Transition compat: map the old @wyre-technology scope to GitHub
      # Packages too, so repos still depending on @wyre-technology/* SDKs
      # (not yet republished under @wyre-ai) keep resolving during migration.
      - name: Add legacy npm scope registry (migration compat)
        run: echo "@wyre-technology:registry=https://npm.pkg.github.com" >> "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
